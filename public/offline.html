<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0c" />
    <title>WatchNext · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f3ee; --fg: #1b1714; --muted: #6f665d; --accent: #d9661f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0d0c; --fg: #f2ede6; --muted: #9b9389; --accent: #f59e4c; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 8px 0 0; font-size: 24px; }
      p { margin: 0; color: var(--muted); max-width: 22rem; line-height: 1.5; }
      button { margin-top: 8px; border: 0; border-radius: 999px; padding: 10px 22px; font: inherit; font-weight: 600; background: var(--accent); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>WatchNext needs a connection to load your picks. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
